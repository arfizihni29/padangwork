name: Hourly Job Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour at minute 0
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: "[TEST] Kirim Pesan via curl ke Telegram"
      run: |
        echo "Token ada? ${{ secrets.TELEGRAM_TOKEN != '' }}"
        echo "Chat ID: ${{ secrets.TELEGRAM_CHAT_ID }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="✅ GitHub Actions aktif! Bot loker Padang siap jalan." \
          -d parse_mode="HTML"

    - name: Test Telegram Connection (Node.js)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: node test_telegram.js

    - name: Run Scraper
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: node index.js

    - name: Commit and Push sent_jobs.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sent_jobs.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "Update sent jobs history"
        git push
